name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-ui:
    runs-on: ubuntu-latest
    env:
      LOW_MEMORY_MODE: "true"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Bytecode compile check
        run: |
          python -m compileall -q app.py config.py run_backend.py backend agent src tests

      - name: Run core, UI hardening, backend, and Render readiness tests
        run: |
          python tests/test_stage1.py
          python tests/test_stage2.py
          python -m pytest tests/test_stage3.py -k "not test_real_model_integration" -q
          python tests/test_stage4.py
          python tests/test_ui_and_hardening.py
          python tests/test_render_readiness.py
          python tests/test_backend_and_ai.py

  windows-agent-e2e:
    runs-on: windows-latest
    env:
      LOW_MEMORY_MODE: "true"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Run Windows agent collector & live E2E tests
        run: |
          python tests/test_agent_collectors.py
          python tests/test_e2e_live.py
